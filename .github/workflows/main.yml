name: Build APK

on:
  push:
    branches: [ "**" ] # Compila em qualquer branch (main, master, etc.)
  pull_request:
  workflow_dispatch: # Permite clicar no botão "Run workflow" pelo navegador

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Dar permissão ao gradlew (se existir)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Compilar APK Debug
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Disponibilizar APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KaonaBACH-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Criar Release Direta com o APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "B.A.C.H. Android APK (Build Recente)"
          body: "Build gerada automaticamente via GitHub Actions. Baixe o APK abaixo em Assets."
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
